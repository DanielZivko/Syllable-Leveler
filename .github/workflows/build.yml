name: Test engine and build macOS AU
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DSYLLABLE_BUILD_PLUGIN=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  audio-unit:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal AU targeting Big Sur
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build --config Release --parallel 3
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Sign development bundle and validate Audio Unit
        shell: bash
        run: |
          component='build/SyllableLeveler_artefacts/Release/AU/Syllable Leveler.component'
          codesign --force --sign - "$component"
          codesign --verify --strict "$component"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto "$component" "$HOME/Library/Audio/Plug-Ins/Components/Syllable Leveler.component"
          /usr/libexec/PlistBuddy -c 'Print :AudioComponents' "$component/Contents/Info.plist"
          # The runner may have cached its Audio Unit list before the copy.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          /usr/bin/auval -a
          /usr/bin/auval -v aufx Sylv Zivk
      - name: Package component (development build, not notarized)
        run: ditto -c -k --sequesterRsrc --keepParent 'build/SyllableLeveler_artefacts/Release/AU/Syllable Leveler.component' SyllableLeveler-AU-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SyllableLeveler-AU-development
          path: SyllableLeveler-AU-development.zip
